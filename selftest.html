<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>selftest · 中医外科学</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="css/practice.css">
</head>
<body>
<div id="app"><header id="hd"></header><main id="main"></main><nav id="tabbar"></nav></div>
<div id="toast"></div><div id="dialog"></div><div id="R"></div>
<script src="js/version.js"></script>
<script src="data/material.js"></script>
<script src="data/practice.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/practiceview.js"></script>
<script src="js/misc.js"></script>
<script src="js/boot.js"></script>
<script>
/* 中医外科学 · 自测（断言 ≥120 条，2026-11-25 新目录/翻页卡片形态）
   覆盖：material 自洽 / core 数据层 / 章折叠目录 / 翻页卡片 / 搜索 / 练习数据 /
        选择题生成器 200 次随机 / 默写页 / 选择题页 / 收藏笔记编辑隐藏 / 返回键 / 布局。
   —— 全部断言数据驱动：换成真实 material.js / practice.js 后仍然成立。 */
(function () {
  'use strict';
  var Z = window.WK, UI = window.WK_UI, P = window.WK_PRACTICE, C = window.WK_CARDS;
  var Pn = 0, F = 0, L = [];
  function ok(name, cond, detail) {
    if (cond) { Pn++; }
    else { F++; L.push('FAIL ' + name + (detail !== undefined ? ' :: ' + detail : '')); }
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function q(sel) { return document.querySelector(sel); }
  function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function nav(h) { location.hash = h; UI.render(); }
  function mainTxt() { return (document.getElementById('main').textContent || ''); }
  function tx(sel) { var e = q(sel); return e ? e.textContent : ''; }
  function closeDlg() { try { UI.closeDialog(false); } catch (e) { } }
  function loadRes(src) { return fetch(src, { method: 'HEAD', cache: 'no-store' }).then(function (r) { return r.ok; }).catch(function () { return false; }); }
  function sy(d) { return Z.syOf(d).filter(function (s) { return s && s.name; }); }
  function isCardHref(h) { return /^#\/card\/[A-Za-z0-9_-]+(\?p=\d+)?$/.test(String(h || '')); }
  function symHrefRe(h) { return /^#\/card\/[A-Za-z0-9_-]+\?p=\d+$/.test(String(h || '')); }
  function activeTab() { var k = -1; qa('.pg-tab').forEach(function (b, i) { if (b.classList.contains('on')) k = i; }); return k; }
  function walkBlocks(bs, fn) {
    (bs || []).forEach(function (b) {
      if (!b || !b.t) return;
      fn(b);
      if (b.t === 'sub') walkBlocks(b.blocks, fn);
    });
  }
  function blockTypes(bs) { var t = {}; walkBlocks(bs, function (b) { t[b.t] = (t[b.t] || 0) + 1; }); return t; }

  async function run() {
    var snap = null, openSnap = null;
    try {
      snap = JSON.parse(JSON.stringify({
        drafts: Z.store.drafts, prec: Z.store.prec, fav: Z.store.fav, notes: Z.store.notes,
        edits: Z.store.edits, sel: Z.store.sel, hidden: Z.store.hidden, last: Z.store.last
      }));
      openSnap = localStorage.getItem('wk.cat.open.v1');
      /* 断言不依赖用户已有的收藏/笔记/隐藏/编辑：先清空，收尾时原样恢复 */
      Z.store.fav = {}; Z.store.notes = {}; Z.store.hidden = {}; Z.store.edits = {};
      Z.store.sel = {}; Z.store.drafts = []; Z.store.prec = [];
      Z.save(true);

      /* ============================================================
       *  A. material 数据自洽（新 schema）
       * ============================================================ */
      ok('接口：WK / WK_UI / WK_CARDS / WK_PRACTICE 已加载', !!window.WK && !!window.WK_UI && !!C && !!P);
      ok('数据：window.WK_MAT 存在', !!window.WK_MAT);
      var MS = Z.MAT.stats || {};
      var CHS = Z.MAT.chapters || [], CARDS = Z.MAT.cards || [];
      ok('数据：章数 = 9', CHS.length === 9, CHS.length);
      ok('数据：stats.chapters 与数组一致', MS.chapters === CHS.length, MS.chapters + '/' + CHS.length);
      ok('数据：卡片数 = 132', CARDS.length === 132, CARDS.length);
      ok('数据：stats.cards 与数组一致', MS.cards === CARDS.length, MS.cards + '/' + CARDS.length);
      var totalPages = CARDS.reduce(function (n, c) { return n + ((c.pages || []).length); }, 0);
      ok('数据：页数 = stats.pages（当前 ' + MS.pages + '）', totalPages === MS.pages && totalPages > 400, totalPages + '/' + MS.pages);
      var diseaseIds = [];
      CHS.forEach(function (ch) { (ch.diseaseIds || []).forEach(function (id) { diseaseIds.push(id); }); });
      ok('数据：病证数 = 124 且 stats.diseases 一致', diseaseIds.length === 124 && MS.diseases === 124, diseaseIds.length + '/' + MS.diseases);
      var kinds = {};
      CARDS.forEach(function (c) { kinds[c.kind] = (kinds[c.kind] || 0) + 1; });
      ok('数据：kind 只含 chapter/main/sub/attach', Object.keys(kinds).every(function (k) {
        return ['chapter', 'main', 'sub', 'attach'].indexOf(k) >= 0;
      }), JSON.stringify(kinds));
      ok('数据：章概述卡数量 = 有 cardId 的章数（当前 8）', kinds.chapter === CHS.filter(function (ch) {
        return !!ch.cardId;
      }).length && kinds.chapter >= 1, kinds.chapter);
      ok('数据：主病证 = 病证数 − 子病证 − 附病', kinds.main === diseaseIds.length - kinds.sub - kinds.attach, kinds.main);
      ok('数据：子病证 23 张', kinds.sub === 23, kinds.sub);
      ok('数据：附病 8 张', kinds.attach === 8, kinds.attach);
      ok('数据：card id 唯一', (function () {
        var s = {}; return CARDS.every(function (c) { if (!c.id || s[c.id]) return false; s[c.id] = 1; return true; });
      })());
      ok('数据：每张卡有 id/kind/name/displayName/chapterId', CARDS.every(function (c) {
        return c && c.id && c.kind && c.name && c.displayName && c.chapterId;
      }));
      ok('数据：卡片 chapterId 都指向有效章', CARDS.every(function (c) { return !!Z.chapterById(c.chapterId); }));
      ok('数据：每张卡至少 1 页', CARDS.every(function (c) { return Array.isArray(c.pages) && c.pages.length >= 1; }));
      ok('数据：单卡页数 ≤ 8（实测最多 8 页）', CARDS.every(function (c) { return c.pages.length <= 8; }));
      ok('数据：每页标题非空', CARDS.every(function (c) { return c.pages.every(function (p) { return p && p.title && String(p.title).trim(); }); }));
      ok('数据：每页 blocks 非空', CARDS.every(function (c) { return c.pages.every(function (p) { return Array.isArray(p.blocks) && p.blocks.length > 0; }); }));
      var BADT = ['p', 'h', 'img', 'table', 'syn', 'sub'];
      ok('数据：block 类型全部合法（含 sub 递归）', (function () {
        var bad = 0;
        CARDS.forEach(function (c) { c.pages.forEach(function (p) { walkBlocks(p.blocks, function (b) { if (BADT.indexOf(b.t) < 0) bad++; }); }); });
        return bad === 0;
      })());
      var bt = { p: 0, h: 0, img: 0, table: 0, syn: 0, sub: 0 };
      CARDS.forEach(function (c) {
        c.pages.forEach(function (p) {
          walkBlocks(p.blocks, function (b) { bt[b.t]++; });
        });
      });
      ok('数据：插图数 = stats.figs（当前 ' + MS.figs + '）', bt.img === MS.figs && MS.figs > 0, bt.img + '/' + MS.figs);
      ok('数据：表格数 = stats.tables（当前 ' + MS.tables + '）', bt.table === MS.tables && MS.tables > 0, bt.table + '/' + MS.tables);
      ok('数据：证型数 = stats.syndromes（当前 ' + MS.syndromes + '）', bt.syn === MS.syndromes && MS.syndromes > 0, bt.syn + '/' + MS.syndromes);
      ok('数据：每个 img 块都有 src 且为 img/fig/ 下文件', (function () {
        var bad = 0;
        CARDS.forEach(function (c) { c.pages.forEach(function (p) { walkBlocks(p.blocks, function (b) {
          if (b.t === 'img' && (!b.src || b.src.indexOf('img/fig/') !== 0)) bad++;
        }); }); });
        return bad === 0;
      })());
      ok('数据：每个 table 块都有 img 与 cap', (function () {
        var bad = 0;
        CARDS.forEach(function (c) { c.pages.forEach(function (p) { walkBlocks(p.blocks, function (b) {
          if (b.t === 'table' && (!b.img || !b.cap)) bad++;
        }); }); });
        return bad === 0;
      })());
      var syns = [];
      CARDS.forEach(function (c) { c.pages.forEach(function (p) { walkBlocks(p.blocks, function (b) { if (b.t === 'syn') syns.push(b); }); }); });
      ok('数据：证型字段完整（sid/name/clinic/treat/formula）', syns.every(function (s) {
        return s.sid && s.name && s.clinic && s.treat && s.formula;
      }), syns.length);
      ok('数据：证型 formulaNames 为非空字符串数组', syns.every(function (s) {
        return Array.isArray(s.formulaNames) && s.formulaNames.length > 0 &&
          s.formulaNames.every(function (n) { return n && String(n).trim(); });
      }));
      ok('数据：JSON 里没有 undefined 字样', JSON.stringify(Z.MAT).indexOf('undefined') < 0);
      ok('数据：章 diseaseIds 都指向存在的卡', CHS.every(function (ch) {
        return (ch.diseaseIds || []).length > 0 && (ch.diseaseIds || []).every(function (id) { return !!Z.cardById(id); });
      }));
      ok('数据：每个病证只挂在 1 个章里', (function () {
        var cnt = {};
        CHS.forEach(function (ch) { (ch.diseaseIds || []).forEach(function (id) { cnt[id] = (cnt[id] || 0) + 1; }); });
        return Object.keys(cnt).every(function (id) { return cnt[id] === 1; }) && Object.keys(cnt).length === 124;
      })());
      ok('数据：章概述卡（非空 cardId）都是 kind=chapter', CHS.every(function (ch) {
        if (!ch.cardId) return true;
        var c = Z.cardById(ch.cardId);
        return !!c && c.kind === 'chapter';
      }));
      ok('数据：第十四章没有概述卡', !Z.chapterById('ch14').cardId);
      ok('数据：子病证 / 附病 parentId 都指向存在的卡', CARDS.every(function (c) {
        if (c.kind !== 'sub' && c.kind !== 'attach') return true;
        return !!c.parentId && !!Z.cardById(c.parentId);
      }));
      ok('数据：子病证 / 附病 displayName 带「·」前缀', CARDS.every(function (c) {
        if (c.kind !== 'sub' && c.kind !== 'attach') return true;
        return String(c.displayName).indexOf('·') > 0;
      }));
      ok('数据：总字数 > 200000', (MS.chars || 0) > 200000, MS.chars);

      /* ============================================================
       *  B. core 数据层 API
       * ============================================================ */
      ok('core：cardById(d0601) 命中疖', !!Z.cardById('d0601') && Z.cardById('d0601').name === '疖');
      ok('core：cardById 不存在返回 null', Z.cardById('nope999') === null);
      ok('core：chapterById(ch06) 命中第六章', !!Z.chapterById('ch06') && Z.chapterById('ch06').name === '疮疡');
      var ch6 = Z.chapterById('ch06');
      ok('core：cardsOfChapter(ch06) 数量 = diseaseIds 数量', Z.cardsOfChapter('ch06').length === ch6.diseaseIds.length,
        Z.cardsOfChapter('ch06').length + '/' + ch6.diseaseIds.length);
      ok('core：cardsOfChapter 顺序 = diseaseIds 顺序', Z.cardsOfChapter('ch06').every(function (c, i) {
        return c.id === ch6.diseaseIds[i];
      }));
      ok('core：chapterCard(ch06) = d0600', (Z.chapterCard(ch6) || {}).id === 'd0600');
      ok('core：chapterCard(ch14) = null', Z.chapterCard(Z.chapterById('ch14')) === null);
      var seq6 = Z.chapterSequence('ch06');
      ok('core：章序列第一个是章概述卡', seq6[0] === 'd0600', seq6[0]);
      ok('core：章序列无重复', (function () { var s = {}; return seq6.every(function (id) { if (s[id]) return false; s[id] = 1; return true; }); })());
      ok('core：navCard 下一个 = 本章下一个病证', Z.navCard('d0601', 1) === 'd0602', Z.navCard('d0601', 1));
      ok('core：navCard 上一个正确', Z.navCard('d0601', -1) === 'd0600', Z.navCard('d0601', -1));
      ok('core：navCard 章首再往前 = ""', Z.navCard('d0600', -1) === '', Z.navCard('d0600', -1));
      ok('core：navCard 章末再往后 = ""', Z.navCard('d0613', 1) === '', Z.navCard('d0613', 1));
      Z.setHidden('d0602', true);
      ok('core：navCard 跳过隐藏的卡', Z.navCard('d0601', 1) === 'd0602a', Z.navCard('d0601', 1));
      Z.setHidden('d0602', false);
      var vc = Z.viewCard('d0601');
      ok('core：viewCard 返回 4 页', vc && vc.pages.length === 4, vc && vc.pages.length);
      ok('core：viewCard 无编辑时 hasEdit=false', vc && vc.hasEdit === false);
      ok('core：syndromeHref 生成 #/card/…?p=…', Z.syndromeHref({ cardId: 'd0601', page: 2 }) === '#/card/d0601?p=2',
        Z.syndromeHref({ cardId: 'd0601', page: 2 }));
      ok('core：syndromeHref 对无效卡返回 ""', Z.syndromeHref({ cardId: 'nope', page: 0 }) === '');
      ok('core：esc 转义 < > & "', Z.esc('<a href="x">&\'') === '&lt;a href=&quot;x&quot;&gt;&amp;&#39;');
      var synHTML = Z.renderRich([{ t: 'syn', sid: 's1', name: '热毒蕴结证', clinic: '红肿疼痛', treat: '清热解毒', formula: '五味消毒饮' }]);
      ok('core：syn 渲染出临床表现/治法/代表方', synHTML.indexOf('临床表现：') > 0 && synHTML.indexOf('治法：') > 0 &&
        synHTML.indexOf('代表方：') > 0 && synHTML.indexOf('热毒蕴结证') > 0);
      ok('core：syn 空 clinic 输出「原书未单列」', Z.renderRich([{ t: 'syn', sid: 's2', name: 'X', clinic: '', treat: 'T', formula: 'F' }]).indexOf('原书未单列') > 0);
      var subHTML = Z.renderRich([{ t: 'sub', title: '2.外治疗法', blocks: [
        { t: 'p', x: '外敷金黄散' }, { t: 'sub', title: '3.其他疗法', blocks: [{ t: 'p', x: '中成药' }] }
      ] }]);
      ok('core：sub 递归渲染（嵌套 sub）', subHTML.indexOf('sec sub') > 0 && subHTML.indexOf('2.外治疗法') > 0 &&
        subHTML.indexOf('外敷金黄散') > 0 && subHTML.indexOf('3.其他疗法') > 0 && subHTML.indexOf('中成药') > 0);
      ok('core：blocksText 抽出正文（含 sub 内）', Z.pageText(vc.pages[0]).indexOf('疖是指发生在肌肤浅表部位') >= 0);
      var p0 = vc.pages[0];
      ok('core：pagePText 段落数 = 该页 p 块数', Z.pagePText(p0).split('\n\n').length === 7,
        Z.pagePText(p0).split('\n\n').length);
      var rp = Z.replacePageP(p0, '改后第一段\n\n改后第二段');
      ok('core：replacePageP 段数变少 → 删多余 p，图/表块保留', (function () {
        var ps = rp.filter(function (b) { return b.t === 'p'; }).length;
        var others = rp.filter(function (b) { return b.t !== 'p'; }).length;
        return ps === 2 && others === 2 && rp[0].x === '改后第一段' && rp[1].x === '改后第二段';
      })(), JSON.stringify(rp.map(function (b) { return b.t; })));
      var rp2 = Z.replacePageP(p0, ['P0', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'].join('\n\n'));
      ok('core：replacePageP 段数变多 → 多出的并进最后一段', (function () {
        var ps = rp2.filter(function (b) { return b.t === 'p'; });
        return ps.length === 7 && ps[6].x === 'P6\nP7\nP8';
      })(), JSON.stringify(rp2.filter(function (b) { return b.t === 'p'; }).map(function (b) { return b.x; })));
      Z.savePageEdit('d0601', 0, '自测改写一\n\n自测改写二');
      var vc2 = Z.viewCard('d0601');
      ok('core：savePageEdit 后 viewCard.hasEdit=true', vc2.hasEdit === true);
      ok('core：savePageEdit 只改 p 块，图块仍在', (function () {
        var bs = vc2.pages[0].blocks;
        var ps = bs.filter(function (b) { return b.t === 'p'; }).length;
        var imgs = bs.filter(function (b) { return b.t === 'img'; }).length;
        var hs = bs.filter(function (b) { return b.t === 'h'; }).length;
        return ps === 2 && imgs === 1 && hs === 1 && bs[0].x === '自测改写一';
      })(), JSON.stringify(vc2.pages[0].blocks.map(function (b) { return b.t; })));
      ok('core：edits 结构为 {pages:[…]}（未改的页为 null）', (function () {
        var e = Z.store.edits['d0601'];
        return !!e && Array.isArray(e.pages) && !!e.pages[0] && e.pages[1] === null;
      })());
      Z.savePageEdit('d0601', 0, Z.pagePText(vc.pages[0]));
      ok('core：把文本改回原文 → 编辑位自动清空', !Z.store.edits['d0601']);
      Z.savePageEdit('d0601', 1, '临时');
      Z.clearEdits('d0601');
      ok('core：clearEdits 恢复原文', !Z.viewCard('d0601').hasEdit && !Z.store.edits['d0601']);

      /* 当前数据下的动态参数（数据升级后断言仍成立） */
      var d0 = Z.cardById('d0601');
      var P0 = d0.pages.length;
      var p0p = d0.pages[0].blocks.filter(function (b) { return b.t === 'p'; }).length;
      var synN = d0.pages[2].blocks.filter(function (b) { return b.t === 'syn'; }).length;
      var subN6 = ch6.diseaseIds.filter(function (id) { return Z.cardById(id).kind === 'sub'; }).length;

      /* ============================================================
       *  C. 目录（章可折叠）
       * ============================================================ */
      C.resetOpen();
      nav('#/catalog'); await wait(50);
      ok('目录：标题 = 病证目录', tx('#hd .hd-title').indexOf('病证目录') === 0, tx('#hd .hd-title'));
      ok('目录：9 个章行', qa('.chap').length === 9, qa('.chap').length);
      ok('目录：默认全部折叠', qa('.chap.open').length === 0, qa('.chap.open').length);
      ok('目录：章行显示「第X章 名称」', tx('.chap .cn').indexOf('第六章') === 0, tx('.chap .cn'));
      ok('目录：章行有「N 个病证」chip', tx('.chap .chap-hd .chip').indexOf('30 个病证') >= 0, tx('.chap .chap-hd .chip'));
      ok('目录：底部统计 = 共 124 个病证（9 章）· 附病 8 个',
        mainTxt().indexOf('共 124 个病证') >= 0 && mainTxt().indexOf('9 章') >= 0 && mainTxt().indexOf('附病 8 个') >= 0);
      q('[data-chap-hd="ch06"]').click(); await wait(40);
      ok('目录：点章行展开', q('.chap[data-chap="ch06"]').classList.contains('open'));
      ok('目录：展开后行数 = diseaseIds + 本章概述', qa('.chap[data-chap="ch06"] .dr[data-dr]').length === ch6.diseaseIds.length + 1,
        qa('.chap[data-chap="ch06"] .dr[data-dr]').length + '/' + (ch6.diseaseIds.length + 1));
      ok('目录：本章概述行有「述」chip', (q('.chap-first .dr') || {}).textContent.indexOf('述') >= 0);
      ok('目录：子病证行数 = 本章子病证数（当前 ' + subN6 + '）', qa('.chap[data-chap="ch06"] .dr.sub').length === subN6,
        qa('.chap[data-chap="ch06"] .dr.sub').length + '/' + subN6);
      ok('目录：子病证缩进 30px', (function () {
        var el = q('.chap[data-chap="ch06"] .dr.sub');
        return !!el && parseFloat(getComputedStyle(el).paddingLeft) >= 29;
      })());
      ok('目录：子病证显示 displayName（含「·」）', (function () {
        var el = q('.chap[data-chap="ch06"] .dr.sub .nm');
        return !!el && el.textContent.indexOf('·') > 0;
      })(), (q('.chap[data-chap="ch06"] .dr.sub .nm') || {}).textContent);
      q('[data-chap-hd="ch07"]').click(); await wait(40);
      ok('目录：附病行带「附」chip', (function () {
        var row = q('.chap[data-chap="ch07"] .dr.attach');
        return !!row && row.textContent.indexOf('附') >= 0;
      })());
      ok('目录：附病行缩进', (function () {
        var el = q('.chap[data-chap="ch07"] .dr.attach');
        return !!el && parseFloat(getComputedStyle(el).paddingLeft) >= 29;
      })());
      ok('目录：再点章行可折叠', (function () {
        q('[data-chap-hd="ch06"]').click();
        return !q('.chap[data-chap="ch06"]').classList.contains('open');
      })());
      /* 目录内搜索过滤 */
      var kwEl = q('#cat-kw');
      kwEl.value = '疖'; kwEl.oninput(); await wait(360);
      var rows = qa('#cat-list .dr[data-dr]');
      ok('目录：搜索「疖」有命中且不是全部', rows.length >= 1 && rows.length < 50, rows.length);
      ok('目录：搜索过滤后每行名称都含关键词', rows.every(function (r) {
        return r.textContent.indexOf('疖') >= 0;
      }));
      ok('目录：搜索时命中章强制展开', qa('#cat-list .chap.open').length >= 1);
      kwEl.value = ''; kwEl.oninput(); await wait(360);
      ok('目录：清空搜索恢复 9 章', qa('.chap').length === 9, qa('.chap').length);
      /* 管理（批量隐藏） */

      var gen = { n: 0, badLen: 0, dup: 0, undef: 0, idxOut: 0, missCorrect: 0, decoyHit: 0, over6: 0, badLetter: 0, nullBad: 0, orderDup: 0 };
      var DIMS = P._dims, orders = {};
      for (var it = 0; it < 200; it++) {
        var dd = examDs[Math.floor(Math.random() * examDs.length)];
        var dim = DIMS[Math.floor(Math.random() * DIMS.length)];
        var qq = P._buildChoiceQ(dd, dim.k);
        if (!qq) { if (dim.get(dd).length) gen.nullBad++; continue; }
        gen.n++;
        if (qq.opts.length > P.MAX_OPT) gen.badLen++;
        var seenO = {};
        qq.opts.forEach(function (o) {
          if (o === undefined || o === null || String(o).trim() === '' || String(o) === 'undefined') gen.undef++;
          if (seenO[o]) gen.dup++; seenO[o] = 1;
        });
        var corrText = qq.correct.map(function (i) { return qq.opts[i]; });
        if (qq.correct.some(function (i) { return i < 0 || i >= qq.opts.length; })) gen.idxOut++;
        if (qq.correctText.some(function (t) { return corrText.indexOf(t) < 0; })) gen.missCorrect++;
        if (corrText.length > 6) gen.over6++;
        qq.opts.forEach(function (o, oi) {
          if (corrText.indexOf(o) < 0 && qq.correctText.indexOf(o) >= 0) gen.decoyHit++;
          if (P.letter(oi) === undefined || P.letter(oi) === '?') gen.badLetter++;
        });
        var sig = qq.opts.join('¦');
        if (!orders[dd.id + '|' + dim.k]) orders[dd.id + '|' + dim.k] = {};
        if (orders[dd.id + '|' + dim.k][sig]) gen.orderDup++;
        orders[dd.id + '|' + dim.k][sig] = 1;
      }

      ok('选择题：题干含病证名与「包括以下哪些」',

      ok('选择题：每题选项 ≤12 且字母都不 undefined', (function () {

      q('#rs-again').click(); await wait(180);
      ok('结果页：「再来一组」重新随机（新 run、分数清零）', (function () {
        var r = P._run();
        return !!r && r.i === 0 && r.finished === false && Object.keys(r.res || {}).length === 0;

       *  I. 收藏 / 笔记 / 编辑 / 隐藏（目录联动）

      nav('#/catalog'); await wait(40);
      ok('收藏：目录行出现 ★ 标记', qa('.dr[data-dr="d0601"] .flag.star').length === 1);

      ok('收藏页：收藏项就是 d0601', (q('#main a[href^="#/card/"]') || {}).getAttribute &&

      ok('壳子：index.html 引用 material.js / core.js / cards.js',

      if (snap) {
        Z.store.drafts = snap.drafts; Z.store.prec = snap.prec; Z.store.fav = snap.fav;

      if (C) C.removeManageBar();
      closeDlg();

    var out = document.getElementById('R');

    document.title = 'selftest P=' + Pn + ' F=' + F;
    if (window.console) console.log(out.textContent);
    window.__SELFTEST = { pass: Pn, fail: F, fails: L };

  window.addEventListener('load', function () { setTimeout(run, 150); });
})();
